services:
  automl-api:
    environment:
      AUTOML_ALLOWED_HOSTS: >-
        ${AUTOML_PUBLIC_HOST:?set AUTOML_PUBLIC_HOST},
        ${AUTOML_SECONDARY_PUBLIC_HOST:?set AUTOML_SECONDARY_PUBLIC_HOST},
        automl-api,localhost,127.0.0.1
      AUTOML_PUBLIC_BASE_URLS: >-
        https://${AUTOML_PUBLIC_HOST:?set AUTOML_PUBLIC_HOST}:${AUTOML_HTTPS_PORT:-8443},
        https://${AUTOML_SECONDARY_PUBLIC_HOST:?set AUTOML_SECONDARY_PUBLIC_HOST}:${AUTOML_HTTPS_PORT:-8443}

  gateway-secondary:
    image: "${AUTOML_CADDY_IMAGE:-docker.m.daocloud.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}"
    restart: unless-stopped
    depends_on:
      automl-api:
        condition: service_healthy
    ports:
      - "${AUTOML_SECONDARY_HTTPS_BIND_ADDRESS:?set AUTOML_SECONDARY_HTTPS_BIND_ADDRESS}:${AUTOML_HTTPS_PORT:-8443}:8443"
    environment:
      AUTOML_GATEWAY_MAX_BODY_BYTES: "${AUTOML_GATEWAY_MAX_BODY_BYTES:-115343360}"
      AUTOML_PUBLIC_HOST: "${AUTOML_SECONDARY_PUBLIC_HOST:?set AUTOML_SECONDARY_PUBLIC_HOST}"
      GOMAXPROCS: "${AUTOML_GATEWAY_GOMAXPROCS:-2}"
    volumes:
      - type: bind
        source: ./deploy/single-node/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: "${AUTOML_CADDY_DATA_HOST_DIR:-./.automl-production/caddy-data}"
        target: /data
      - type: bind
        source: "${AUTOML_CADDY_CONFIG_HOST_DIR:-./.automl-production/caddy-config}"
        target: /config
    networks: [frontend, backend]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: "${AUTOML_GATEWAY_PIDS_LIMIT:-512}"
    cpus: "${AUTOML_GATEWAY_CPU_LIMIT:-1.0}"
    mem_limit: "${AUTOML_GATEWAY_MEMORY_LIMIT:-256m}"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --no-check-certificate
          -qO- "https://$$AUTOML_PUBLIC_HOST:8443/healthz" >/dev/null
      interval: 30s
      timeout: 8s
      start_period: 15s
      retries: 5
